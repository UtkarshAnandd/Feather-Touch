       NOT a school photograph. Never shown in production (lib/slideshow.ts). -->
  <defs>
    <pattern id="hatch" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="36" height="36" fill="#f6e7ca"/>
