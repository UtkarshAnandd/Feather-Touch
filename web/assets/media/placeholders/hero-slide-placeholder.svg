    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#hatch)"/>
  <rect x="40" y="40" width="720" height="920" rx="28" fill="none" stroke="#1e3a2b" stroke-width="6" stroke-dasharray="28 18"/>
  <rect x="130" y="330" width="540" height="300" rx="20" fill="#fffbf3" stroke="#1e3a2b" stroke-width="4"/>
  <g fill="#1e3a2b" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="400" y="420" font-size="54" font-weight="700" letter-spacing="4">PLACEHOLDER</text>
    <text x="400" y="490" font-size="34" font-weight="600">Not a school photo</text>
